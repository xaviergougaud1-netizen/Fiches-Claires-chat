<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#2a46a8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icons/icon-192.png"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Fiches Claires</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Lexend:wght@400;600&family=Playwrite+FR+Moderne:wght@300;400&display=swap">
<style id="fc-style">
/* Mise en page : barre d'outils fine en haut, scène plein cadre en volets redimensionnables ; la fiche reste toujours une feuille blanche, seul le cadre suit le thème. */
:root{
  --bg:#e9edf4; --panel:#ffffff; --panel-2:#f4f6fa; --fg:#1b2438; --muted:#5b6680; --line:#d3dae6;
  --accent:#2a46a8; --accent-soft:#e3e9fb; --marge:#d04a5a; --ok:#177245; --warn:#9a5b00;
  --ui:'Atkinson Hyperlegible', 'Segoe UI', Arial, sans-serif;
  --display:'Bricolage Grotesque', 'Atkinson Hyperlegible', Arial, sans-serif;
  /* papier : identique dans les deux thèmes (c'est une feuille d'élève) */
  --paper:#ffffff; --paper-ink:#141414; --paper-creme:#fbf5e6; --paper-line:#c4cad6; --paper-soft:#f2f4f8;
  --g-rouge:#d62828; --g-bleu:#1d4ed8; --g-vert:#15803d; --g-noir:#141414; --corr:#0f6e64;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#121826; --panel:#1b2233; --panel-2:#222b3f; --fg:#e7ebf4; --muted:#9ba5bd; --line:#2f3a52; --accent:#8ea4f2; --accent-soft:#283357; --marge:#ec7b88; --ok:#5fcf98; --warn:#f0b35a; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#121826; --panel:#1b2233; --panel-2:#222b3f; --fg:#e7ebf4; --muted:#9ba5bd; --line:#2f3a52; --accent:#8ea4f2; --accent-soft:#283357; --marge:#ec7b88; --ok:#5fcf98; --warn:#f0b35a; color-scheme:dark }

html,body{height:100%}
body{background:var(--bg); color:var(--fg); font-family:var(--ui); font-size:14px; overflow:hidden}
button,select,input,textarea{font:inherit; color:inherit}
.app{height:100%; display:flex; flex-direction:column; min-height:0}

/* ---------- barre du haut ---------- */
.top{display:flex; flex-wrap:wrap; align-items:center; gap:8px 14px; padding:8px 16px; background:var(--panel); border-bottom:1px solid var(--line)}
.brand{display:flex; align-items:center; gap:9px; font-family:var(--display); font-weight:800; font-size:18px; letter-spacing:-.01em; white-space:nowrap}
.brand-mark{width:26px; height:26px; border-radius:5px; background:var(--paper); border:1px solid var(--line); position:relative; overflow:hidden; flex:none}
.brand-mark::before{content:""; position:absolute; left:7px; top:0; bottom:0; width:2px; background:var(--marge)}
.brand-mark::after{content:""; position:absolute; inset:6px 3px 4px 11px; background:repeating-linear-gradient(to bottom, transparent 0 4px, #9fb0dd 4px 5px)}
.grp{display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0}
.sep{width:1px; align-self:stretch; background:var(--line)}
.spacer{flex:1}
.btn{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--panel); padding:6px 11px; border-radius:7px; cursor:pointer; white-space:nowrap; line-height:1.2}
.btn:hover{border-color:var(--accent)}
.btn:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--panel)}
.btn.small{padding:3px 8px; font-size:12.5px; border-radius:6px}
.btn[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--fg)}
.btn svg{width:16px; height:16px}
.seg{display:inline-flex; border:1px solid var(--line); border-radius:8px; overflow:hidden}
.seg button{border:0; background:var(--panel); padding:6px 12px; cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--panel)}
select,input[type=number],input[type=text],textarea{background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:5px 7px}
input[type=number]{width:58px}
.fiche-title{min-width:0; width:min(320px,40vw); font-weight:700}
label.chk{display:inline-flex; align-items:center; gap:5px; cursor:pointer; white-space:nowrap}
.lbl-mini{font-size:12px; color:var(--muted)}

/* barre de marquage grammatical */
.marks{position:fixed; z-index:40; display:flex; flex-wrap:wrap; align-items:center; gap:4px; padding:5px; background:var(--panel); border:1px solid var(--line); border-radius:9px; box-shadow:0 6px 20px rgba(0,0,0,.18); max-width:calc(100vw - 32px)}
.mk{border:1px solid var(--line); background:var(--paper); color:var(--paper-ink); border-radius:6px; padding:4px 9px; cursor:pointer; font-family:'Andika',Arial,sans-serif; font-size:13.5px}
.mk:hover{border-color:var(--accent)}
.mk .smp{padding:0 3px}
.hint{color:var(--muted); font-size:12.5px}
.vig{display:flex; align-items:center; gap:8px; padding:6px 16px; background:var(--panel); border-bottom:1px solid var(--line); color:var(--warn); font-size:13px}
.vig b{color:var(--fg)}

/* ---------- scène & volets ---------- */
.stage{flex:1; min-height:0; display:flex; position:relative; background:var(--bg)}
.stage.col{flex-direction:column}
.pane{position:relative; display:flex; flex-direction:column; min-width:0; min-height:0; background:var(--panel-2)}
.pane-bar{display:flex; flex-wrap:wrap; align-items:center; gap:6px 8px; padding:6px 10px; background:var(--panel); border-bottom:1px solid var(--line); font-size:13px; z-index:3}
.pane-bar select,.pane-bar input{padding:3px 5px; font-size:13px}
.pane-body{flex:1; min-height:0; overflow:auto; position:relative}
.splitter{flex:none; background:var(--line); position:relative; z-index:4; touch-action:none}
.stage.row>.splitter{width:8px; cursor:col-resize}
.stage.col>.splitter{height:8px; cursor:row-resize}
.splitter::after{content:""; position:absolute; inset:50% auto auto 50%; transform:translate(-50%,-50%); background:var(--muted); border-radius:2px; opacity:.6}
.stage.row>.splitter::after{width:2px; height:34px}
.stage.col>.splitter::after{width:34px; height:2px}
.splitter:hover,.splitter.drag{background:var(--accent)}

/* préparation : la fiche comme une feuille posée sur le bureau */
.paper-wrap{padding:18px 16px 60px; display:flex; justify-content:center}
.paper-wrap>.sheet{width:100%; max-width:860px; background:var(--paper); border-radius:4px; box-shadow:0 1px 3px rgba(20,30,60,.12), 0 8px 24px rgba(20,30,60,.08); padding:1.1em 1.2em}

/* projection : volets plein cadre, barres qui se cachent */
.view-proj .pane{background:var(--paper)}
.view-proj .pane-bar{position:absolute; top:0; left:0; right:0; z-index:8; opacity:0; transition:opacity .15s; box-shadow:0 2px 10px rgba(0,0,0,.12)}
.view-proj .pane:hover .pane-bar,.view-proj .pane:focus-within .pane-bar,.view-proj .pane-bar.pin{opacity:1}
/* plein écran : les barres (et le curseur) se cachent quand la souris ne bouge plus ; un mouvement les fait revenir */
html.fs-idle .view-proj .pane-bar:not(.pin){opacity:0 !important; pointer-events:none}
html.fs-idle .pane-nav,html.fs-idle .ex-chips:not(.some-hidden){opacity:0 !important; pointer-events:none; transition:opacity .3s}
html.fs-idle #stage{cursor:none}
.pane-body.paper-blanc{background:var(--paper)}
.pane-body.paper-creme{background:var(--paper-creme)}
.pane-body.paper-contraste{background:#ffffff}
.proj-wrap{width:100%; height:100%; box-sizing:border-box}
.measure{position:absolute; left:0; top:0; visibility:hidden; pointer-events:none}
.pane-nav{position:absolute; right:12px; bottom:10px; display:flex; gap:6px; align-items:center; z-index:3; background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:3px 6px; opacity:.85; font-variant-numeric:tabular-nums}
.pane-nav button{border:0; background:transparent; cursor:pointer; padding:2px 7px; border-radius:999px; font-size:15px}
.pane-nav button:hover{background:var(--accent-soft)}
.pane-empty{padding:40px 24px; color:var(--muted); text-align:center; line-height:1.5}

/* ---------- la feuille d'exercices ---------- */
.sheet{font-family:var(--font, 'Andika', Arial, sans-serif); line-height:var(--lh,1.5); letter-spacing:var(--ls,0); word-spacing:var(--ws,0); color:var(--paper-ink); text-align:left; overflow-wrap:break-word}
.sheet.proj{column-gap:1.4em; column-rule:1px solid var(--paper-line)}
.sheet.libre{padding:1em 1.4em 3em; max-width:none}
.paper-contraste .sheet{font-weight:600; color:#000}
.ex{position:relative; break-inside:avoid; page-break-inside:avoid; padding:.45em .3em .6em; border-bottom:1px solid var(--paper-line)}
.ex:last-of-type{border-bottom:0}
.sheet.proj .ex{padding:.35em .2em .55em}
.ex-head{display:flex; align-items:flex-start; gap:.4em; padding-right:1.6em}
.ex-num{flex:none; min-width:1.45em; height:1.45em; padding:0 .3em; border-radius:.75em; background:#22304f; color:#fff; display:inline-flex; align-items:center; justify-content:center; font-weight:700; font-size:.85em; margin-top:.12em; letter-spacing:0}
.defi-tag{background:#fff; color:#7a5300; border:.09em solid #b07a00; white-space:nowrap; font-size:.75em; margin-top:.2em}
.picto{flex:none; color:#22304f; display:inline-flex; margin-top:.12em}
.picto svg{width:1.2em; height:1.2em}
.consigne{flex:1; min-width:0}
.consigne b,.consigne strong{font-weight:700}
.ref{position:absolute; top:.35em; right:.25em; font-size:.5em; line-height:1; color:#8b93a5; letter-spacing:.03em; font-family:Arial,sans-serif; background:none; border:0; padding:.1em .2em; cursor:pointer; border-radius:.2em; z-index:3}
.ref:hover,.ref:focus-visible{color:#2a46a8; background:#eef2fd; text-decoration:underline}
.a5 .ref{cursor:default}
.lbl{display:inline-block; font-size:.62em; text-transform:uppercase; letter-spacing:.08em; color:#4a5677; font-family:Arial,sans-serif; font-weight:700; margin-right:.6em; vertical-align:.12em}
.exemple{margin:.3em 0 .1em 1.85em; padding:.2em .55em; border-left:.18em solid #8e9cc6; background:var(--paper-soft)}
.exemple>div,.rappel>div{display:inline}
.rappel{margin:.35em 0 .15em 1.85em; padding:.25em .55em; border:.08em dashed #5e6c9b; border-radius:.3em; font-size:.92em}
.banque{display:flex; flex-wrap:wrap; gap:.3em .45em; margin:.4em 0 .1em 1.85em; padding:.3em .45em; border:.08em solid #b9c2d6; border-radius:.3em}
.mot{padding:0 .45em; border:.06em solid #8f98ad; border-radius:.9em; background:#fff}
.items{list-style:none; margin:.3em 0 0 1.85em; padding:0; display:grid; grid-template-columns:repeat(var(--cols,1),minmax(0,1fr)); gap:.2em 1.3em; counter-reset:it}
.items>li{counter-increment:it; display:flex; flex-wrap:wrap; align-items:baseline; gap:0 .4em; position:relative; min-width:0}
.items>li::before{content:counter(it, lower-alpha) "."; color:#4a5677; font-weight:700; min-width:1.1em}
.items[data-lab="num"]>li::before{content:counter(it, decimal) "."}
.items[data-lab="none"]>li::before{content:none}
.items[data-lab="none"]>li{gap:0}
.items>li>.it{flex:1; min-width:0}
.items>li>.zone{flex-basis:100%; margin-left:1.5em}
.v-dys .items{gap:.45em 1.5em}
.texte{margin:.35em 0 0 1.85em; counter-reset:ln}
.texte .ln{position:relative; counter-increment:ln; padding-left:0}
.texte.num .ln{padding-left:1.6em}
.texte.num .ln::before{content:counter(ln); position:absolute; left:0; top:.1em; font-size:.62em; color:#8b93a5; font-family:Arial,sans-serif}
.relier{margin:.4em 0 0 1.85em; display:grid; grid-template-columns:minmax(0,1fr) auto minmax(2em,3.5em) auto minmax(0,1fr); gap:.35em .3em; align-items:center}
.relier .row{display:contents}
.relier{counter-reset:rl}
.relier .row>.l{counter-increment:rl}
.relier .row>.l::before{content:counter(rl, lower-alpha) ". "; color:#4a5677; font-weight:700}
.relier[data-lab="num"] .row>.l::before{content:counter(rl, decimal) ". "}
.relier[data-lab="none"] .row>.l::before{content:none}
.dot{width:.45em; height:.45em; border-radius:50%; background:#141414; display:inline-block}
.relier .r{text-align:left}
.tab-wrap{margin:.4em 0 0 1.85em; overflow-x:auto}
.tab{border-collapse:collapse}
.tab th,.tab td{border:.08em solid #333; padding:.15em .55em; text-align:center; min-width:2.5em}
.tab th{background:var(--paper-soft)}
.zone{margin:.15em 0 0 1.85em}
.zone .l{height:calc(1.75em * var(--esp,1)); border-bottom:.07em solid #a9b1c2}
.trou{display:inline-block; min-width:calc(3.6em * var(--esp,1)); height:calc(1.05em * var(--esp,1)); border-bottom:.09em solid #333; vertical-align:-.12em; margin:0 .1em}
.choix .opt{padding:0 .2em; border-radius:.3em}
.choix .sep{color:#8b93a5}
/* version dys : les propositions à entourer sont des pastilles encadrées, faciles à repérer dans le texte */
.v-dys .choix{display:inline-flex; flex-wrap:wrap; align-items:center; gap:.3em .7em; margin:.25em .1em .1em; vertical-align:middle}
.v-dys .choix .sep{display:none}
.v-dys .choix .opt{border:.11em solid #22304f; border-radius:.55em; padding:.06em .6em; background:#f4f6ff; font-weight:700}
/* code couleur : seulement dans la version dys */
.v-lisible .g-verbe,.v-reponses .g-verbe,.v-lisible .g-co,.v-reponses .g-co{border-bottom:0; padding-bottom:0}
.v-lisible .g-sujet,.v-lisible .g-cc,.v-lisible .g-gv,.v-reponses .g-sujet,.v-reponses .g-cc,.v-reponses .g-gv{border:0; padding:0}
.frac{display:inline-flex; flex-direction:column; align-items:center; vertical-align:-.88em; line-height:1.05; font-size:.92em; margin:0 .1em; white-space:nowrap}
.frac>span{display:block; text-align:center; min-width:1.6em; line-height:1.05}
/* La barre de fraction se place sur la ligne d’écriture, et non au milieu de la hauteur du texte. */
.frac>span:first-child{border-bottom:.08em solid currentColor; padding:0 .15em}
.fig{margin:.45em 0 .1em 1.85em}
.fig img{display:block; width:100%; height:auto}
.fig-s{max-width:35%} .fig-m{max-width:60%} .fig-l{max-width:100%}
.svgfig svg{display:block; width:100%; height:auto}
.rep{display:none; color:var(--corr); font-weight:700}
.show-corr .rep{display:inline}
.show-corr .rep::before{content:"→ "}
.editing .rep{display:none}
.editing.show-corr .rep{display:inline; min-width:3em; outline:1px dashed #9cc; outline-offset:1px}
.masque,.ex-masque{visibility:hidden}
.step-nav{position:absolute; left:12px; bottom:10px; z-index:6; display:flex; gap:4px; align-items:center; background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:4px 6px; font-variant-numeric:tabular-nums; box-shadow:0 2px 10px rgba(0,0,0,.12)}
.step-nav button{border:0; background:transparent; color:inherit; cursor:pointer; padding:4px 10px; border-radius:999px; font:inherit; font-weight:700}
.step-nav button:hover{background:var(--accent-soft)}
.step-nav span{padding:0 4px; color:var(--muted); font-size:13px}
.lesson-card{display:flex; flex-direction:column; gap:10px}
.lesson-card .lc-t{margin:0; font-size:17px}
.lesson-card .lc-c{margin:0; padding:10px 12px; border-left:3px solid var(--accent); background:var(--panel-2); line-height:1.5}

/* code couleur de la classe */
.g-verbe{border-bottom:.13em solid var(--g-rouge); padding-bottom:.01em}
.g-co{border-bottom:.13em solid var(--g-noir); padding-bottom:.01em}
.g-sujet,.g-cc,.g-gv{border:.1em solid; border-radius:.18em; padding:0 .12em; box-decoration-break:clone; -webkit-box-decoration-break:clone}
.g-sujet{border-color:var(--g-bleu)}
.g-cc{border-color:var(--g-vert)}
.g-gv{border-color:var(--g-rouge)}
.g-gv .g-co,.g-gv .g-verbe{margin:0 .05em}

/* édition */
.editing [contenteditable="true"]{outline:1px solid transparent; border-radius:3px; transition:outline-color .1s}
.editing [contenteditable="true"]:hover{outline-color:#c9d3ec}
.editing [contenteditable="true"]:focus{outline:2px solid #8ea4f2; background:#fbfcff}
.ex-del{position:absolute; top:4px; right:4px; width:26px; height:26px; display:inline-flex; align-items:center; justify-content:center; border:1px solid #e3c2c8; border-radius:50%; background:#fff; color:#b23a4b; cursor:pointer; font:700 14px/1 Arial,sans-serif; padding:0; z-index:4; opacity:.75; letter-spacing:0}
.ex-del:hover,.ex-del:focus-visible{opacity:1; background:#c8394d; border-color:#c8394d; color:#fff}
.sheet.proj .ex-del{opacity:0; transition:opacity .15s}
.sheet.proj .ex:hover>.ex-del,.sheet.proj .ex-del:focus-visible{opacity:.9}
.editing .ref,.sheet.proj .ref{right:36px}
.ex-undys{position:absolute; top:4px; right:36px; height:26px; display:inline-flex; align-items:center; border:1px solid #b9c5ea; border-radius:13px; background:#fff; color:#2a46a8; cursor:pointer; font:700 12px/1 Arial,sans-serif; padding:0 10px; z-index:4; letter-spacing:0; word-spacing:0; white-space:nowrap; opacity:.85}
.ex-undys:hover,.ex-undys:focus-visible{opacity:1; background:#2a46a8; border-color:#2a46a8; color:#fff}
.sheet.proj .ex-undys{opacity:0; transition:opacity .15s}
.sheet.proj .ex:hover>.ex-undys,.sheet.proj .ex-undys:focus-visible{opacity:.95}
.editing.v-dys .ref,.sheet.proj.v-dys .ref,.sheet.libre.v-dys .ref{right:160px}
.editing.v-dys .ex-head{padding-right:150px}
.editing .ex-head{padding-right:2.4em}
.ex.non-dys::before{content:"version non dys"; position:absolute; right:.3em; bottom:.2em; font-family:Arial,sans-serif; font-size:.45em; color:#9aa3b5; letter-spacing:.04em}
.sheet.proj .ex.non-dys::before,.a5 .ex.non-dys::before{content:none}
.toast-act{border:0; background:transparent; color:inherit; font:inherit; font-weight:700; text-decoration:underline; cursor:pointer; padding:0 4px}
.twin-list{display:flex; flex-direction:column; gap:6px; max-height:55vh; overflow:auto}
.twin{display:grid; grid-template-columns:auto auto minmax(0,1fr) auto; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:8px 10px; cursor:pointer}
.twin:has(input:checked){border-color:var(--accent); background:var(--accent-soft)}
.twin-n{font-weight:700; min-width:2.2em}
.twin-i{color:var(--muted); font-size:12.5px; white-space:nowrap}
.ex-hide{position:absolute; top:4px; right:36px; height:26px; display:inline-flex; align-items:center; border:1px solid #c9d0de; border-radius:13px; background:#fff; color:#3a4560; cursor:pointer; font:700 12px/1 Arial,sans-serif; padding:0 10px; z-index:4; opacity:0; transition:opacity .15s; letter-spacing:0; word-spacing:0}
.sheet.proj .ex:hover>.ex-hide,.sheet.libre .ex:hover>.ex-hide,.ex-hide:focus-visible{opacity:.95}
.ex-hide:hover{background:#3a4560; color:#fff; border-color:#3a4560}
.sheet.proj.v-dys .ex-undys,.sheet.libre.v-dys .ex-undys{right:112px}
.sheet.libre .ex-del,.sheet.libre .ex-undys{opacity:0}
.sheet.libre .ex:hover>.ex-del,.sheet.libre .ex:hover>.ex-undys{opacity:.9}
.ex-chips{position:absolute; left:50%; bottom:10px; transform:translateX(-50%); z-index:6; display:flex; flex-wrap:wrap; gap:4px; align-items:center; justify-content:center; max-width:calc(100% - 200px); background:var(--panel); color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:4px 8px; box-shadow:0 2px 10px rgba(0,0,0,.12); opacity:0; transition:opacity .15s}
.pane:hover .ex-chips,.ex-chips:focus-within{opacity:.95}
.chip-ex{min-width:28px; height:26px; border-radius:13px; border:1px solid var(--accent); background:var(--accent); color:var(--panel); font:700 13px/1 Arial,sans-serif; cursor:pointer; padding:0 6px}
.chip-ex.off{background:transparent; color:var(--muted); border-color:var(--line); text-decoration:line-through}
.chip-all{border:0; background:transparent; color:var(--accent); font:700 12px/1 Arial,sans-serif; cursor:pointer; padding:4px 6px; text-decoration:underline}
.top{display:flex; flex-wrap:wrap; align-items:center; gap:8px 0; padding:8px 16px}
.top>.grp{padding:0 14px; border-left:1px solid var(--line)}
.top>.brand{padding-right:14px}
[hidden]{display:none!important}

const LIVRET_URL = 'https://drive.google.com/file/d/1xclkCHubhwTt_imIUun5PE30KXbsHhdl/view';
const INDEX_URL = 'https://docs.google.com/spreadsheets/d/1QQk4w3U7PZoAWgvYsAaysFX9bZzsn_1pSc0N2F6AvaQ/edit';
const LECONS = [{"code": "G1", "titre": "Phrase simple et phrase complexe (CM2)", "contenu": "Phrase simple = un seul verbe conjugué. Phrase complexe = autant de propositions que de verbes conjugués. Propositions juxtaposées (, ; :) ou coordonnées (mais, ou, et, donc, or, ni, car). Méthode : je souligne les verbes conjugués et je les compte.", "pages": "3–5"}, {"code": "G2", "titre": "Les types et les formes de phrases (CM1)", "contenu": "Trois types : déclarative (.), interrogative (?), impérative (. ou !). Formes : affirmative, négative (ne… pas, ne… plus, ne… jamais…, autour du verbe conjugué), exclamative (!). Une phrase a toujours un type et une forme.", "pages": "6–8"}, {"code": "G3", "titre": "Le groupe nominal (GN) (CM1)", "contenu": "Le GN = déterminant + nom. Il peut être enrichi par des expansions (CM2) : adjectif (un chat noir) ou GN prépositionnel (un chat de gouttière). Le nom noyau ne change pas : le petit chat de la voisine → chat.", "pages": "9"}, {"code": "G4", "titre": "Le nom (CM1)", "contenu": "Le nom désigne une personne, un animal, un objet, une chose, une émotion. Nom commun : je peux mettre un, une, des devant. Nom propre : il commence par une majuscule (Thomas, Paris).", "pages": "10"}, {"code": "G5", "titre": "Le déterminant (CM1)", "contenu": "Il se place devant le nom et indique son genre et son nombre. Articles définis (le, la, l’, les), indéfinis (un, une, des), possessifs (mon, ton, son, notre, leur…), démonstratifs (ce, cet, cette, ces). Test : je peux le remplacer par un, une ou des.", "pages": "11–12"}, {"code": "G6", "titre": "L’adjectif qualificatif (CM1)", "contenu": "Il qualifie le nom, se place avant ou après lui et s’accorde en genre et en nombre avec lui. Fonction (CM2) : épithète (à côté du nom) ou attribut du sujet (après un verbe d’état). Test : « il est très… ».", "pages": "13–14"}, {"code": "G7", "titre": "Le verbe (CM1)", "contenu": "Il exprime une action ou un état ; il change avec la personne et le temps. Infinitif ; radical + terminaison. 1er groupe : -er (sauf aller) ; 2e groupe : -ir et « nous …issons » ; 3e groupe : tous les autres. Test : il change quand je change le sujet ou le temps ; ne… pas l’encadre.", "pages": "15–17"}, {"code": "G8", "titre": "Les pronoms (CM1)", "contenu": "Le pronom remplace un nom ou un GN et évite les répétitions. Pronoms personnels sujets (je, tu, il, elle, on, nous, vous, ils, elles), COD (me, te, le, la, l’, nous, vous, les), COI (me, te, lui, nous, vous, leur). Je vois Paul → je le vois ; je parle à Paul → je lui parle.", "pages": "18–19"}, {"code": "G9", "titre": "Les mots invariables (CM1-CM2)", "contenu": "Ils ne changent jamais de forme. Prépositions (à, dans, par, pour, en, vers, avec, de, sans, sous, sur), conjonctions de coordination (mais, ou, et, donc, or, ni, car), de subordination CM2 (que, quand, lorsque, si, parce que), adverbes. Ou (choix) ≠ où (lieu).", "pages": "20–21"}, {"code": "G10", "titre": "Les adverbes (CM1)", "contenu": "Mots invariables qui modifient le sens d’un verbe, d’un adjectif ou d’un autre adverbe. Sens : lieu, temps, manière, quantité/intensité, négation. Beaucoup d’adverbes de manière finissent par -ment (lent → lentement).", "pages": "22–23"}, {"code": "G11", "titre": "Le sujet (CM1)", "contenu": "Il indique de qui ou de quoi on parle et commande l’accord du verbe. GN, nom propre ou pronom. Tests : « c’est… qui » / « Qui est-ce qui… ? Qu’est-ce qui… ? ». Il peut être éloigné du verbe ou inversé (CM2). Code : encadré en bleu.", "pages": "24–25"}, {"code": "G12", "titre": "Le groupe verbal (GV) (CM1)", "contenu": "Le GV est construit autour du verbe : c’est ce que l’on dit du sujet. Verbe seul, verbe + complément d’objet, ou verbe + attribut du sujet. Il peut être coupé en plusieurs parties. Code : GV encadré en rouge, verbe souligné en rouge.", "pages": "26–27"}, {"code": "G13", "titre": "Les compléments d’objet (CM1)", "contenu": "Ils font partie du GV : on ne peut ni les déplacer ni les supprimer. COD sans préposition (verbe + qui ? quoi ?). COI introduit par à, de, au, aux, du, des (verbe + à qui ? à quoi ? de qui ? de quoi ?). Code : souligné en noir.", "pages": "28–30"}, {"code": "G14", "titre": "Les compléments circonstanciels (CM1)", "contenu": "Ils précisent les circonstances : lieu (où ?), temps (quand ?), manière (comment ?), cause (pourquoi ?). On peut les déplacer et les supprimer. Une phrase peut en avoir plusieurs. Code : encadrés en vert.", "pages": "31–32"}, {"code": "G15", "titre": "L’attribut du sujet (CM1)", "contenu": "Il donne une information sur le sujet, relié par un verbe d’état (être, paraître, sembler, devenir, demeurer, rester, avoir l’air) qu’on peut remplacer par être. Ni supprimable ni déplaçable. L’adjectif attribut s’accorde avec le sujet.", "pages": "33–34"}, {"code": "G16", "titre": "Les expansions du nom (CM2)", "contenu": "Elles précisent le nom et font partie du GN : adjectif épithète (une petite maison) ou complément du nom introduit par une préposition ou un article contracté (une tasse à café, un pull en laine, l’école du quartier).", "pages": "35–36"}, {"code": "C1", "titre": "Le présent des verbes du 1er groupe (CM1)", "contenu": "Radical + -e, -es, -e, -ons, -ez, -ent (muettes au singulier et à ils : je pense au sujet). Nous mangeons, nous commençons, nous distinguons. -yer : y → i devant e muet (j’essuie). -eler/-eter : è (je pèle, j’achète) sauf appeler, jeter → consonne double.", "pages": "37–39"}, {"code": "C2", "titre": "Le présent des verbes du 2e et du 3e groupe (CM1)", "contenu": "2e groupe : -is, -is, -it, -issons, -issez, -issent. 3e groupe : le plus souvent -s, -s, -t, -ons, -ez, -ent ; pouvoir, vouloir → -x ; verbes en -dre → -ds, -d. Vous faites, vous dites ; ils font, ils vont. Aller : je vais, tu vas, il va, nous allons, vous allez, ils vont.", "pages": "40–42"}, {"code": "C3", "titre": "Le présent des verbes être et avoir (CM1)", "contenu": "Avoir : j’ai, tu as, il a, nous avons, vous avez, ils ont. Être : je suis, tu es, il est, nous sommes, vous êtes, ils sont. Ne pas confondre a/à, est/et, ont/on, sont/son : je remplace par l’imparfait (il avait, il était).", "pages": "43–44"}, {"code": "C4", "titre": "L’imparfait de l’indicatif (CM1)", "contenu": "Terminaisons pour tous les verbes : -ais, -ais, -ait, -ions, -iez, -aient, ajoutées au radical de « nous » au présent (nous finissons → je finissais). Je mangeais, je lançais ; nous criions, nous voyions. Actions qui durent, descriptions, habitudes passées.", "pages": "45–47"}, {"code": "C5", "titre": "Le futur de l’indicatif (CM1)", "contenu": "Terminaisons : -ai, -as, -a, -ons, -ez, -ont ajoutées à l’infinitif entier (je chanterai, nous finirons) ; verbes en -re : j’enlève le e (tu prendras). On entend « r » avant la terminaison. Irréguliers : j’aurai, je serai, j’irai, je ferai, je verrai, je viendrai, je pourrai, je voudrai.", "pages": "48–50"}, {"code": "C6", "titre": "Le passé simple de l’indicatif (CM2)", "contenu": "Récits, contes. 1er groupe et aller : -ai, -as, -a, -âmes, -âtes, -èrent (il chanta). 2e et 3e groupes : -s, -s, -t, -^mes, -^tes, -rent avec i, u ou in (il finit, il prit, il fut, ils vinrent). Mangea, commença.", "pages": "51–54"}, {"code": "C7", "titre": "Le passé composé de l’indicatif (CM1)", "contenu": "Auxiliaire être ou avoir au présent + participe passé (-é, -i, -is, -it, -u). Avec être, le participe s’accorde avec le sujet (elles sont allées). CM2 : avec avoir, accord avec le COD seulement s’il est placé avant (« Qu’est-ce qui est… ? » déjà écrit → j’accorde).", "pages": "55–58"}, {"code": "C8", "titre": "Le plus-que-parfait de l’indicatif (CM2)", "contenu": "Action plus ancienne qu’une autre action passée. Auxiliaire être ou avoir à l’imparfait + participe passé : elle avait fini, elle était allée. Mêmes règles d’accord qu’au passé composé.", "pages": "59–60"}, {"code": "O1", "titre": "Nature ou fonction ? (CM1-CM2)", "contenu": "La nature (classe) est ce que le mot est et ne change pas ; la fonction est son rôle dans la phrase et change selon la phrase (le chat : sujet, COD…). Natures : nom, déterminant, adjectif, verbe, pronom, adverbe, préposition, conjonction.", "pages": "61–62"}, {"code": "O2", "titre": "Analyser les fonctions d’une phrase (CM1)", "contenu": "5 étapes : 1) verbe conjugué souligné en rouge ; 2) sujet encadré en bleu ; 3) CC (où ? quand ? comment ? pourquoi ?) encadrés en vert ; 4) groupe verbal encadré en rouge ; 5) compléments d’objet soulignés en noir.", "pages": "63"}, {"code": "O3", "titre": "Les natures de mots (CM1)", "contenu": "Tests : déterminant → remplaçable par un, une, des ; nom → on peut mettre un déterminant devant ; adjectif → « il est très… » ; verbe → ne… pas, change avec le temps ; pronom → remplace un nom ; adverbe, préposition, conjonction → invariables.", "pages": "64"}, {"code": "O4", "titre": "Aide-mémoire des temps (CM1-CM2)", "contenu": "Présent, imparfait (-ais…), futur (infinitif + -ai…), passé simple, passé composé et plus-que-parfait (auxiliaire + participe passé) : terminaisons de tous les temps.", "pages": "65–67"}];

    if (!list.length) { info.className = 'status err'; info.textContent = 'Coche au moins une version qui contient des exercices.'; return; }
    if (o.fmt === 'pdf' && (!window.jspdf || !window.html2canvas)) { info.className = 'status err'; info.textContent = 'Les outils PDF ne se sont pas chargés : vérifie la connexion puis recharge la page.'; return; }
    go.disabled = true; let n = 0;
    try {
      for (const vk of list) {
        info.className = 'status'; info.innerHTML = ''; info.append(h('span', { class: 'spin' }), h('span', {}, `Fichier ${n + 1} / ${list.length}…`));
        if (o.fmt === 'html') {
          await saveFile(fileBase(f) + (vk ? '-' + VNAME[vk] : '') + '.html', buildSavedPage(vk ? uiFor(vk) : null), 'text/html');
        } else {
          const po = Object.assign({ orient: 'portrait', impo: '1', m: 4, titre: true, entete: true, mark: false }, store.get('fc.export', {}), { vers: [vk] });
          const res = printSet(f, po); const blob = await buildPdf(res, po); $('#printhost').innerHTML = '';
          await saveFile(`${fileBase(f)}-${VNAME[vk]}-A5.pdf`, blob, 'application/pdf');
        }
        n++;
      }
      d.close(); toast(n > 1 ? `${n} fichiers enregistrés dans tes téléchargements.` : 'Fiche enregistrée.' + (o.fmt === 'html' ? ' Double-clique sur le fichier pour la rouvrir.' : ''), 6000);
    } catch (e) {
      info.className = 'status err'; info.textContent = e && e.code === 'declined' ? `Enregistrement arrêté (${n} fichier${n > 1 ? 's' : ''} enregistré${n > 1 ? 's' : ''}).` : 'L’enregistrement a échoué' + (e && e.code ? ` (${e.code})` : '') + '.';
    } finally { go.disabled = false; }
  };
}
function applySaved(j) {
  if (!j || !j.fiche || !j.fiche.versions) throw 0;
  const fi = j.fiche; fi.source = fi.source || { text: '', pages: [] }; fi.images = fi.images || {};
  for (const vk of ['lisible', 'dys']) fi.versions[vk].style = Object.assign(clone(STYLE[vk]), fi.versions[vk].style || {});
  ensureRep(fi); S.fiches[fi.id] = fi; S.currentId = fi.id;
  if (j.ui && j.ui.prep && j.ui.proj) S.ui = j.ui;
  for (const k in libreCache) libreCache[k].remove();
  for (const k in libreCache) delete libreCache[k];
  LIBRE_RESTORE = j.libre || {};
  saveNow(); renderAll();
}
$('#open-input').addEventListener('change', async ev => {
  const fl = ev.target.files[0]; ev.target.value = ''; if (!fl) return;
  try {
    const txt = await fl.text();
    if (/\.html?$/i.test(fl.name) || /^\s*<!doctype/i.test(txt)) {
      const el = new DOMParser().parseFromString(txt, 'text/html').getElementById('fc-saved');
      applySaved(el ? JSON.parse(el.textContent) : null); toast('Fiche ouverte telle qu’enregistrée.'); return;
    }
    const j = JSON.parse(txt);
    if (j && j.app === 'fiches-claires') { applySaved(j); toast('Fiche ouverte.'); return; }
    if (!j || !j.versions || !j.versions.lisible || !j.versions.dys) throw 0;
    j.id = uid(); j.source = j.source || { text: '', pages: [] }; j.images = j.images || {};
    for (const vk of ['lisible', 'dys']) j.versions[vk].style = Object.assign(clone(STYLE[vk]), j.versions[vk].style || {});
    addFiche(j); toast('Fiche ouverte.');
  } catch (e) { toast('Ce fichier n’est pas une fiche enregistrée par cet outil.'); }
});

/* ================= collage d'images (Ctrl+V n'importe où) ================= */
const pasteHandlers = [];
let lastPane = 0;
function clipImages(ev) {
  const cd = ev.clipboardData; if (!cd) return [];
  let out = [...(cd.files || [])].filter(f => f && f.type && f.type.startsWith('image/'));
  if (!out.length) out = [...(cd.items || [])].filter(x => x.kind === 'file' && x.type.startsWith('image/')).map(x => x.getAsFile()).filter(Boolean);
  return out;
}
document.addEventListener('paste', ev => {
  const imgs = clipImages(ev);
  if (pasteHandlers.length) { if (imgs.length) { ev.preventDefault(); pasteHandlers[pasteHandlers.length - 1](imgs); } return; }
  if ($('.dlg-back')) return;
  const t = ev.target, editing = t && (t.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName));
  if (editing && !imgs.length) return;
  const here = $(`#stage>.pane[data-i="${lastPane}"]`);
  if (imgs.length && here && here.dataset.content === 'libre') { ev.preventDefault(); getLibre(lastPane).addImages(imgs); return; }
  const text = imgs.length ? '' : (ev.clipboardData && ev.clipboardData.getData('text/plain')) || '';
  if (!imgs.length && !text.trim()) return;
  let target = here && here.dataset.content !== 'libre' ? here : $('#stage>.pane:not([data-content="libre"])');
  if (!target) { if (imgs.length) { ev.preventDefault(); const lp = $('#stage>.pane[data-content="libre"]'); if (lp) getLibre(+lp.dataset.i).addImages(imgs); } return; }
  ev.preventDefault();
  askWhat(+target.dataset.i, { files: imgs, text });
});
/* glisser-déposer sur un volet */
const hasDrop = dt => dt && [...(dt.types || [])].some(x => x === 'Files' || x === 'text/plain');
let overPane = null;
const clearOver = () => { if (overPane) overPane.classList.remove('drop-over'); overPane = null; };
$('#stage').addEventListener('dragover', ev => {
  const p = ev.target.closest && ev.target.closest('.pane');
  if (!p || p.dataset.content === 'libre' || ev.target.closest('[contenteditable="true"]') || !hasDrop(ev.dataTransfer)) { clearOver(); return; }
  ev.preventDefault(); if (overPane !== p) { clearOver(); overPane = p; p.classList.add('drop-over'); }
});
$('#stage').addEventListener('dragleave', ev => { if (!ev.relatedTarget || !$('#stage').contains(ev.relatedTarget)) clearOver(); });
$('#stage').addEventListener('drop', async ev => {
  const p = ev.target.closest && ev.target.closest('.pane');
  clearOver();
  if (!p || p.dataset.content === 'libre' || ev.target.closest('[contenteditable="true"]')) return;
  ev.preventDefault();
  const all = [...(ev.dataTransfer.files || [])];
  const txtFiles = all.filter(x => /^text\//.test(x.type) || /\.txt$/i.test(x.name));
  let text = (await Promise.all(txtFiles.map(x => x.text()))).join('\n\n');
  const files = all.filter(x => !txtFiles.includes(x));
  if (!all.length) text = ev.dataTransfer.getData('text/plain') || '';
  lastPane = +p.dataset.i;
  askWhat(+p.dataset.i, { files, text });
});

/* ================= événements globaux ================= */
$('#fiche-sel').addEventListener('change', ev => { S.currentId = ev.target.value; S.ui.proj.panes.forEach(p => { p.page = 0; p.shown = 0; }); saveSoon(); renderAll(); });
$('#fiche-title').addEventListener('input', ev => { const f = cur(); if (!f) return; f.titre = ev.target.value; saveSoon(); const o = $(`#fiche-sel option[value="${f.id}"]`); if (o) o.textContent = f.titre || 'Sans titre'; });
$('#b-import').addEventListener('click', newBlank);

$('#b-export').addEventListener('click', () => openExport());
$('#b-save').addEventListener('click', () => openSaveDialog());
$('#b-open').addEventListener('click', () => $('#open-input').click());
$$('[data-view]').forEach(b => b.addEventListener('click', () => { S.ui.view = b.dataset.view; saveSoon(); renderAll(); }));
$$('[data-count]').forEach(b => b.addEventListener('click', () => { stageS().count = +b.dataset.count; saveSoon(); renderAll(); }));
$('#b-orient').addEventListener('click', () => { const st = stageS(); st.orient = st.orient === 'row' ? 'col' : 'row'; saveSoon(); renderAll(); });
$('#b-full').addEventListener('click', async () => {
  const stage = $('#stage');
  if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
  if (S.ui.view !== 'proj') { S.ui.view = 'proj'; renderAll(); }
  try { await stage.requestFullscreen(); } catch (e) { toast('Le plein écran n’est pas disponible ici. Utilise la touche F11 de ton navigateur.'); }
});
document.addEventListener('fullscreenchange', () => { $('#b-full').textContent = document.fullscreenElement ? 'Quitter le plein écran' : 'Plein écran'; refitProj(); idleWake(); });
/* barre de navigation du plein écran : cachée après 3 s sans mouvement de souris (sauf si un menu ou les réglages sont ouverts) */
let idleT = null;
function idleWake() {
  document.documentElement.classList.remove('fs-idle'); clearTimeout(idleT);
  if (!document.fullscreenElement) return;
  idleT = setTimeout(() => {
    if (!document.fullscreenElement) return;
    if (document.querySelector('.ex-menu, .settings, dialog[open], .modal')) { idleWake(); return; }
    document.documentElement.classList.add('fs-idle');
  }, 3000);
}
['pointermove', 'pointerdown', 'keydown', 'wheel', 'touchstart'].forEach(t => document.addEventListener(t, idleWake, { passive: true }));
$('#stage').addEventListener('pointerdown', ev => { const p = ev.target.closest('.pane'); if (p) lastPane = +p.dataset.i; });
document.addEventListener('keydown', ev => {
  if ((ev.ctrlKey || ev.metaKey) && !ev.shiftKey && ev.key.toLowerCase() === 'z' && !$('.dlg-back')) {
    const t = ev.target; if (t.isContentEditable || /^(INPUT|TEXTAREA)$/.test(t.tagName)) return;
    const here = $(`#stage>.pane[data-i="${lastPane}"]`), lp = here && here.dataset.content === 'libre' ? here : $('#stage>.pane[data-content="libre"]');
    if (lp) { ev.preventDefault(); getLibre(+lp.dataset.i).undo(); }
    return;
  }
  if (S.ui.view !== 'proj' || $('.dlg-back')) return;
  const t = ev.target; if (t.isContentEditable || /^(TEXTAREA|SELECT)$/.test(t.tagName) || (t.tagName === 'INPUT' && !/^(checkbox|radio|button|range)$/.test(t.type))) return;
  const ps = S.ui.proj.panes[lastPane]; if (!ps || !(isVer(ps.content) || ps.content === 'original')) return;
  if (ev.key === 'ArrowRight' || ev.key === 'PageDown') { ev.preventDefault(); goPage(lastPane, 1); }
  else if (ev.key === 'ArrowLeft' || ev.key === 'PageUp') { ev.preventDefault(); goPage(lastPane, -1); }
  else if (ps.step && (ev.key === ' ' || ev.key === 'Enter' || ev.key === 'ArrowDown')) { ev.preventDefault(); revealNext(lastPane, ev.shiftKey ? -1 : 1); }
  else if (ps.step && (ev.key === 'ArrowUp' || ev.key === 'Backspace')) { ev.preventDefault(); revealNext(lastPane, -1); }
});
if (window.pdfjsLib) { try { pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; } catch (e) { /* lecture PDF indisponible */ } }

renderAll();
if (SAVED) setTimeout(() => toast('Fiche ouverte telle qu’enregistrée le ' + new Date(SAVED.savedAt || Date.now()).toLocaleDateString('fr-FR') + '. Après tes modifications, clique sur « Enregistrer ».', 6000), 400);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => refitProj());
})();
